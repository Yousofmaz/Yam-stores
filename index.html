    <style>

        }

        .welcome-box {
            background: var(--card-bg);
            border: 1px solid var(--primary-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);

        .welcome-box h2 {
