<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض YAM FOR CARS | استيراد وبيع السيارات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #080808);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <!-- الشريط العلوي للموقع -->
    <header class="bg-black/95 border-b gold-border h-16 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-xl object-cover border gold-border" onerror="this.src='https://placehold.co/100x100/111/d4af37?text=YAM'">
            <div>
                <span class="text-sm font-black tracking-wider block">YAM FOR CARS</span>
                <span class="text-[9px] gold-text font-semibold tracking-widest block">معرض السيارات المعتمد</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="admin.html" class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border gold-border text-xs font-bold text-neutral-300 hover:text-white transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-[#d4af37]"></i> الإدارة
            </a>
            <a href="https://wa.me/966554082283" target="_blank" class="px-3.5 py-1.5 rounded-xl bg-[#d4af37] text-black text-xs font-extrabold shadow-lg hover:bg-[#c29f30] transition-all flex items-center gap-1.5">
                <i class="fa-brands fa-whatsapp"></i> تواصل معنا
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموقع -->
    <main class="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6">
        
        <!-- قسم ترحيبي -->
        <div class="card-box p-6 rounded-2xl text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-[#d4af37]/5 rounded-full blur-3xl pointer-events-none"></div>
            <h1 class="text-xl sm:text-2xl font-black text-white mb-2">أهلاً بك في معرض <span class="gold-text">YAM FOR CARS</span></h1>
            <p class="text-xs text-neutral-400 max-w-lg mx-auto">نقدم لك أحدث السيارات المستوردة من كوريا والسوق المحلي بأفضل الأسعار وخيارات الدفع (كاش أو تمويل).</p>
        </div>

        <!-- قسم عرض السيارات -->
        <div>
            <div class="flex items-center justify-between mb-4 pb-2 border-b gold-border">
                <h2 class="text-sm font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-car gold-text"></i> سيارات المعرض المتاحة
                </h2>
                <span id="cars-count-badge" class="text-xs font-mono text-[#d4af37]">0 سيارة</span>
            </div>

            <!-- شبكة عرض السيارات -->
            <div id="store-cars-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <p class="text-center text-neutral-500 col-span-full py-10 text-xs">جاري تحميل السيارات...</p>
            </div>
        </div>

    </main>

    <!-- نافذة تكبير وعرض الصور بالكامل (LightBox) -->
    <div id="image-lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <button onclick="closeLightbox()" class="absolute top-6 left-6 text-white text-xl bg-neutral-900/95 w-11 h-11 rounded-full border gold-border flex items-center justify-center z-50 hover:bg-[#d4af37] hover:text-black transition-all shadow-xl">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative max-w-4xl max-h-[85vh] w-full flex items-center justify-center">
            <button onclick="prevLightboxImage()" class="absolute right-2 sm:-right-12 bg-neutral-900/90 border gold-border text-white w-10 h-10 rounded-full flex items-center justify-center text-base hover:bg-[#d4af37] hover:text-black transition-all z-10 shadow-lg">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <img id="lightbox-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl border gold-border shadow-2xl">
            <button onclick="nextLightboxImage()" class="absolute left-2 sm:-left-12 bg-neutral-900/90 border gold-border text-white w-10 h-10 rounded-full flex items-center justify-center text-base hover:bg-[#d4af37] hover:text-black transition-all z-10 shadow-lg">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
    </div>

    <!-- فوتر الموقع -->
    <footer class="bg-black text-neutral-500 py-4 border-t gold-border text-center text-[11px] font-mono shrink-0">
        YAM FOR CARS Store © 2026 - جميع الحقوق محفوظة
    </footer>

    <!-- Firebase Scripts & Main Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // متغيرات عارض الصور المكبرة
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        window.openLightbox = function(imagesStringJson, index) {
            try {
                currentLightboxImages = JSON.parse(decodeURIComponent(imagesStringJson));
                currentLightboxIndex = index;
                document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
                document.getElementById('image-lightbox').classList.remove('hidden');
            } catch(e) {
                console.error(e);
            }
        };

        window.closeLightbox = function() {
            document.getElementById('image-lightbox').classList.add('hidden');
        };

        window.nextLightboxImage = function() {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
        };

        window.prevLightboxImage = function() {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
        };

        // تسجيل زيارة للموقع عند فتحه
        window.addEventListener('DOMContentLoaded', () => {
            const visitsRef = ref(db, 'stats/totalVisits');
            get(visitsRef).then(snap => {
                let visits = (snap.val() || 0) + 1;
                set(visitsRef, visits);
            });
            loadStoreCars();
        });

        // جلب ونشر السيارات المعتمدة فقط في المتجر
        function loadStoreCars() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val() || {};
                const gridEl = document.getElementById('store-cars-grid');
                const keys = Object.keys(data).filter(k => data[k].approved === true);

                document.getElementById('cars-count-badge').textContent = `${keys.length} سيارة متاحة`;

                if (keys.length === 0) {
                    gridEl.innerHTML = `<p class="text-center text-neutral-500 col-span-full py-12 text-xs">لا توجد سيارات منشورة حالياً، تابعنا قريباً.</p>`;
                    return;
                }

                gridEl.innerHTML = keys.map(key => {
                    const car = data[key];
                    const encodedImages = encodeURIComponent(JSON.stringify(car.images || ['https://placehold.co/600x400']));
                    const firstImage = car.images?.[0] || 'https://placehold.co/600x400';

                    return `
                        <div class="card-box rounded-2xl overflow-hidden flex flex-col justify-between border gold-border hover:border-[#d4af37] transition-all">
                            <div>
                                <!-- صورة السيارة القابلة للضغط والتكبير -->
                                <div class="relative h-48 overflow-hidden bg-neutral-900 group cursor-pointer" onclick="openLightbox('${encodedImages}', 0)">
                                    <img src="${firstImage}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-500" alt="${car.title}">
                                    <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center">
                                        <span class="px-3 py-1.5 bg-black/80 border gold-border rounded-xl text-white text-xs font-bold flex items-center gap-1.5 shadow-lg">
                                            <i class="fa-solid fa-magnifying-glass-plus gold-text"></i> اضغط لتكبير الصور
                                        </span>
                                    </div>
                                    <span class="absolute top-2.5 right-2.5 px-2.5 py-1 bg-[#d4af37] text-black rounded-lg text-[10px] font-black shadow">${car.marketType}</span>
                                    <span class="absolute top-2.5 left-2.5 px-2.5 py-1 bg-black/80 border gold-border text-amber-300 rounded-lg text-[10px] font-bold">${car.statusTag || 'متوفرة'}</span>
                                </div>

                                <div class="p-4 space-y-2">
                                    <h3 class="text-sm font-black text-white line-clamp-1">${car.title}</h3>
                                    <div class="grid grid-cols-2 gap-2 text-[11px] text-neutral-400 pt-1">
                                        <div>الممشى: <strong class="text-white font-mono">${car.mileage || '0'} كم</strong></div>
                                        <div>المكينة: <strong class="text-white font-mono">${car.engineCC || 'غير محدد'}</strong></div>
                                        <div>الدفع: <strong class="text-white font-mono">${car.driveType || 'رباعي'}</strong></div>
                                        <div>الدفع المتاح: <strong class="text-amber-300 font-bold">${car.paymentType || 'كاش أو تمويل'}</strong></div>
                                    </div>
                                    ${car.description ? `<p class="text-[11px] text-neutral-400 line-clamp-2 pt-1 border-t border-neutral-800">${car.description}</p>` : ''}
                                </div>
                            </div>

                            <div class="p-4 pt-0 flex items-center justify-between border-t border-neutral-900 mt-2">
                                <div class="text-sm gold-text font-black font-mono">${car.price.toLocaleString()} ﷼</div>
                                <a href="https://wa.me/966554082283?text=السلام%20عليكم،%20أنا مهتم%20بالسيارة:%20${encodeURIComponent(car.title)}" target="_blank" class="px-3.5 py-2 bg-[#d4af37] text-black text-xs font-extrabold rounded-xl hover:bg-[#c29f30] transition-all flex items-center gap-1.5">
                                    <i class="fa-brands fa-whatsapp"></i> استفسار
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            });
        }
    </script>
</body>
</html>
