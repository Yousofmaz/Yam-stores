<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAM STORES - متجر المواقع والتطبيقات الجاهزة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                }
            }
        }
    </script>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="text-2xl font-black bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">YAM STORES</span>
            </div>

            <nav class="hidden md:flex items-center gap-8 font-semibold text-slate-600">
                <a href="#home" class="hover:text-indigo-600 transition-colors">الرئيسية</a>
                <a href="#products" class="hover:text-indigo-600 transition-colors">المواقع الجاهزة</a>
                <a href="admin.html" class="text-indigo-600 hover:text-indigo-700 transition-colors font-bold"><i class="fa-solid fa-gauge ml-1"></i> لوحة التحكم</a>
            </nav>

            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 transition-colors text-slate-700">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-600 text-white text-xs font-bold rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="pt-16 pb-20 bg-gradient-to-b from-indigo-50/50 via-white to-slate-50 text-center">
        <div class="max-w-4xl mx-auto px-4">
            <span class="px-4 py-2 rounded-full bg-indigo-50 text-indigo-700 font-bold text-sm mb-6 inline-block border border-indigo-100">
                <i class="fa-solid fa-bolt text-indigo-500"></i> متجر رقمي متكامل مرتبط بقاعدة بيانات فورية
            </span>
            <h1 class="text-4xl sm:text-6xl font-black text-slate-900 tracking-tight leading-tight mb-6">
                امتلك موقعك الإلكتروني الجاهز <span class="bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">خلال ثوانٍ</span>
            </h1>
            <p class="text-lg text-slate-600 mb-8">قوالب ومواقع ومتاجر جاهزة للتشغيل الفوري بأسعار تنافسية.</p>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black text-slate-900">المواقع المتاحة حالياً</h2>
            <div id="loading-status" class="text-indigo-600 font-bold text-sm"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل المنتجات...</div>
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- سيتم تعبئة المنتجات تلقائياً من Firebase -->
        </div>
    </section>

    <!-- Shopping Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 left-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="flex items-center justify-between p-6 border-b border-slate-200">
                    <h3 class="text-lg font-black text-slate-900">سلة المشتريات</h3>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
                <div class="border-t border-slate-200 p-6 bg-slate-50">
                    <div class="flex justify-between mb-4 font-bold">
                        <span>المجموع:</span>
                        <span id="cart-total" class="text-2xl text-indigo-600">$0</span>
                    </div>
                    <button onclick="checkout()" class="w-full py-4 rounded-xl bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-600/30">إتمام الطلب</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold flex items-center gap-3 transform translate-y-24 opacity-0 transition-all duration-300">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">تمت العملية بنجاح</span>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let productsData = [];
        let cart = [];

        // جلب المنتجات فوراً من Firebase Realtime Database
        const productsRef = ref(db, 'products');
        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('products-grid');
            document.getElementById('loading-status').style.display = 'none';

            if (data) {
                productsData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                grid.innerHTML = productsData.map(p => `
                    <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all flex flex-col justify-between">
                        <div>
                            <img src="${p.image || 'https://placehold.co/600x400/6366f1/ffffff?text=YAM+Store'}" class="w-full aspect-video object-cover">
                            <div class="p-6">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold">${p.badge || 'متوفر'}</span>
                                <h3 class="text-xl font-bold text-slate-900 mt-2">${p.title}</h3>
                                <p class="text-slate-500 text-sm mt-1">${p.description}</p>
                            </div>
                        </div>
                        <div class="p-6 pt-0 flex items-center justify-between border-t border-slate-100 mt-4">
                            <span class="text-2xl font-black text-indigo-600">$${p.price}</span>
                            <button onclick="window.addToCart('${p.id}')" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-md shadow-indigo-600/20">شراء الآن</button>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">لا توجد منتجات حالياً. أضف منتجاتك عبر لوحة التحكم!</p>`;
            }
        });

        window.addToCart = function(id) {
            const product = productsData.find(p => p.id === id);
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            showToast(`تمت إضافة "${product.title}" للسلة`);
        };

        window.removeFromCart = function(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        };

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            badge.textContent = totalCount;
            badge.classList.toggle('hidden', totalCount === 0);
            totalEl.textContent = `$${totalPrice}`;

            itemsContainer.innerHTML = cart.length === 0 ? `<p class="text-center text-slate-400 py-12">السلة فارغة</p>` :
                cart.map(i => `
                    <div class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                        <img src="${i.image}" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-slate-900">${i.title}</h4>
                            <div class="text-indigo-600 font-extrabold text-sm">$${i.price}</div>
                        </div>
                        <button onclick="window.removeFromCart('${i.id}')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
        }

        window.toggleCart = function() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
        };

        window.checkout = function() {
            if(cart.length === 0) return;
            showToast('تم إرسال الطلب بنجاح وسيتم التواصل معك!');
            cart = [];
            updateCartUI();
            toggleCart();
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
