<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | YAM FOR CARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; } 
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    </style>
</head>
<body class="bg-black text-white antialiased h-screen flex flex-col justify-between">

    <!-- شاشة التحميل -->
    <div id="admin-loader" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="w-12 h-12 border-4 border-neutral-800 border-t-white rounded-full animate-spin mb-4"></div>
        <p class="text-neutral-400 font-bold text-sm tracking-wider">جاري معالجة الطلب...</p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="bg-neutral-950 border border-neutral-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-xl bg-white text-black flex items-center justify-center font-black text-xl mx-auto mb-3 shadow-lg">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl font-black text-white">تسجيل المشرف</h1>
                <p class="text-neutral-400 text-xs mt-1">YAM FOR CARS</p>
            </div>
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">الرقم الوظيفي</label>
                    <input type="text" id="emp-id" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">كلمة المرور</label>
                    <input type="password" id="emp-pass" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                </div>
                <button type="submit" class="w-full py-3 bg-white hover:bg-neutral-200 text-black text-xs font-extrabold rounded-xl shadow-lg transition-all">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-neutral-950 border-b border-neutral-900 shrink-0 h-16">
            <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-black text-base">
                        <i class="fa-solid fa-gauge"></i>
                    </div>
                    <span class="text-base font-black text-white">إدارة YAM FOR CARS</span>
                </div>
                <div class="flex items-center gap-2">
                    <a href="index.html" class="px-3 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 text-xs font-bold text-neutral-300">
                        <i class="fa-solid fa-arrow-right ml-1"></i> الموقع
                    </a>
                    <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 hover:bg-red-950 text-xs font-bold text-red-400">
                        خروج
                    </button>
                </div>
            </div>
        </header>

        <!-- أزرار التنقل بين الصفحات في لوحة التحكم -->
        <div class="bg-neutral-950/50 border-b border-neutral-900 py-3 px-4 shrink-0">
            <div class="max-w-4xl mx-auto grid grid-cols-3 gap-3">
                <button onclick="adminRouter('add-car')" id="btn-tab-add" class="py-2.5 px-3 rounded-xl bg-white text-black font-extrabold text-xs shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> إضافة سيارة
                </button>
                <button onclick="adminRouter('manage-cars')" id="btn-tab-manage" class="py-2.5 px-3 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-bold text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-car-rear"></i> إدارة السيارات
                </button>
                <button onclick="adminRouter('reports')" id="btn-tab-reports" class="py-2.5 px-3 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-bold text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> تقارير المعرض
                </button>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto max-w-4xl mx-auto w-full px-4 py-6">

            <!-- صفحة 1: إضافة وتعديل سيارة -->
            <div id="admin-sec-add" class="bg-neutral-950 border border-neutral-900 rounded-2xl p-6 shadow-xl">
                <h2 id="form-title" class="text-lg font-black text-white mb-4">إضافة سيارة جديدة</h2>
                <form id="product-form" class="space-y-4">
                    <input type="hidden" id="product-id">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">القسم (السوق)</label>
                            <select id="market-type" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                                <option value="">اختر القسم...</option>
                                <option value="المستعمل">السوق المستعمل</option>
                                <option value="الجديد">السوق الجديد</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الشركة المصنعة</label>
                            <select id="manufacturer" required onchange="updateCarModelsList()" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                                <option value="">اختر الشركة...</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">اسم السيارة</label>
                            <select id="car-model-name" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                                <option value="">اختر الشركة أولاً...</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الفئة</label>
                            <select id="car-category" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white">
                                <option value="">اختر الفئة...</option>
                                <option value="فل كامل">فل كامل</option>
                                <option value="نص فل">نص فل</option>
                                <option value="ستاندر / سياحي">ستاندر / سياحي</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الموديل</label>
                            <select id="car-year" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white font-mono">
                                <option value="">الموديل...</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">السعر (بالريال)</label>
                            <input type="number" id="price" required placeholder="مثال: 145000" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white font-mono font-bold">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الممشى</label>
                            <input type="text" id="mileage" placeholder="مثال: 45000 أو أصفر" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-white font-mono">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-1"><i class="fa-solid fa-images ml-1"></i> رفع الصور (حتى 20 صورة)</label>
                        <input type="file" id="image-file-input" multiple accept="image/*" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-white file:text-black cursor-pointer">
                        <div id="upload-preview-container" class="grid grid-cols-5 gap-2 mt-3"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-1">ملاحظات وصفية</label>
                        <textarea id="description" rows="3" placeholder="المواصفات الفنية وملاحظات الفحص..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="save-btn" class="flex-1 py-3 bg-white hover:bg-neutral-200 text-black text-xs font-extrabold rounded-xl shadow-lg transition-all">حفظ السيارة</button>
                        <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden px-4 py-3 bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs font-bold rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- صفحة 2: إدارة السيارات المضافة -->
            <div id="admin-sec-manage" class="hidden space-y-3">
                <h2 class="text-lg font-black text-white mb-4">قائمة السيارات المسجلة</h2>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>

            <!-- صفحة 3: تقارير وحالة المعرض -->
            <div id="admin-sec-reports" class="hidden bg-neutral-950 border border-neutral-900 rounded-2xl p-6">
                <h2 class="text-lg font-black text-white mb-4">إحصائيات المعرض</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1">إجمالي السيارات</span>
                        <span id="stat-total-cars" class="text-3xl font-black text-white font-mono">0</span>
                    </div>
                    <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1">حالة الاتصال</span>
                        <span class="text-emerald-400 font-extrabold text-xs flex items-center gap-1.5 mt-1">
                            <i class="fa-solid fa-circle-check"></i> متصل بقاعدة البيانات
                        </span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Script & Admin Router -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productsRef = ref(db, 'products');

        let allProducts = {};
        let uploadedImagesBase64 = [];

        const carBrandsData = {
            "تويوتا (Toyota)": ["كامري", "لاندكروزر", "كورولا", "هايلكس", "راف فور", "أفالون", "برادو", "فورتشنر"],
            "مرسيدس-بنز (Mercedes-Benz)": ["الفئة S", "الفئة E", "الفئة C", "G-Class", "GLE", "GLS"],
            "بي إم دبليو (BMW)": ["الفئة السابعة", "الفئة الخامسة", "الفئة الثالثة", "X5", "X6", "X7"],
            "هيونداي (Hyundai)": ["سوناتا", "النترا", "توسان", "سانتافي", "آكسنت"],
            "كيا (Kia)": ["تيلوريد", "سورينتو", "سبورتاج", "K5", "سيراتو"],
            "لكزس (Lexus)": ["LX 600", "RX", "ES", "LS", "IS", "NX"],
            "فورد (Ford)": ["إكسبلورر", "إكسبيديشن", "مستنج", "تورس"],
            "شيفروليه (Chevrolet)": ["تاهو", "سوبربان", "كامارو", "ترفرس"],
            "بورش (Porsche)": ["كايين", "ماكان", "باناميرا", "911"],
            "رنج روفر / لاند روفر": ["رنج روفر سبورت", "إيفوك", "ديفندر"],
            "نيسان (Nissan)": ["باترول", "التيما", "صني", "إكس تريل"],
            "رولز رويس (Rolls-Royce)": ["كوليبان", "فانتوم", "گوست"],
            "جينيسيس (Genesis)": ["G70", "G80", "G90", "GV80"],
            "أخرى": ["أخرى"]
        };

        window.addEventListener('DOMContentLoaded', () => {
            const manSelect = document.getElementById('manufacturer');
            for (let brand in carBrandsData) {
                let opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                manSelect.appendChild(opt);
            }

            const yearSelect = document.getElementById('car-year');
            for (let y = 2027; y >= 1990; y--) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            }

            if (localStorage.getItem('admin_logged') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        });

        window.adminRouter = function(tab) {
            const loader = document.getElementById('admin-loader');
            loader.classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('admin-sec-add').classList.add('hidden');
                document.getElementById('admin-sec-manage').classList.add('hidden');
                document.getElementById('admin-sec-reports').classList.add('hidden');

                const btnAdd = document.getElementById('btn-tab-add');
                const btnManage = document.getElementById('btn-tab-manage');
                const btnReports = document.getElementById('btn-tab-reports');

                const activeClass = "py-2.5 px-3 rounded-xl bg-white text-black font-extrabold text-xs shadow-md transition-all flex items-center justify-center gap-2";
                const inactiveClass = "py-2.5 px-3 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-bold text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-2";

                btnAdd.className = inactiveClass;
                btnManage.className = inactiveClass;
                btnReports.className = inactiveClass;

                if (tab === 'add-car') {
                    document.getElementById('admin-sec-add').classList.remove('hidden');
                    btnAdd.className = activeClass;
                } else if (tab === 'manage-cars') {
                    document.getElementById('admin-sec-manage').classList.remove('hidden');
                    btnManage.className = activeClass;
                } else if (tab === 'reports') {
                    document.getElementById('admin-sec-reports').classList.remove('hidden');
                    btnReports.className = activeClass;
                }
                loader.classList.add('hidden');
            }, 200);
        };

        window.updateCarModelsList = function() {
            const man = document.getElementById('manufacturer').value;
            const modelSelect = document.getElementById('car-model-name');
            modelSelect.innerHTML = '<option value="">اختر اسم السيارة...</option>';

            if (man && carBrandsData[man]) {
                carBrandsData[man].forEach(carName => {
                    let opt = document.createElement('option');
                    opt.value = carName;
                    opt.textContent = carName;
                    modelSelect.appendChild(opt);
                });
            }
        };

        document.getElementById('image-file-input').addEventListener('change', function(e) {
            const files = Array.from(e.target.files).slice(0, 20);
            uploadedImagesBase64 = [];
            const previewContainer = document.getElementById('upload-preview-container');
            previewContainer.innerHTML = '';

            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImagesBase64.push(event.target.result);
                    const div = document.createElement('div');
                    div.className = "relative aspect-square rounded-lg overflow-hidden border border-neutral-800 bg-black";
                    div.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover">`;
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        });

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value;
            const pass = document.getElementById('emp-pass').value;
            if (id.trim() && pass.trim()) {
                localStorage.setItem('admin_logged', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else {
                alert('الرجاء تعبئة بيانات الدخول');
            }
        };

        window.logout = function() {
            localStorage.removeItem('admin_logged');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
        };

        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById('admin-products-list');
            const totalStatEl = document.getElementById('stat-total-cars');

            if (data) {
                allProducts = data;
                const keys = Object.keys(data);
                totalStatEl.textContent = keys.length;

                listEl.innerHTML = keys.map(key => {
                    const p = data[key];
                    let mainImg = (p.images && p.images[0]) || p.image || 'https://placehold.co/600x400';
                    return `
                        <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-3 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                                <img src="${mainImg}" class="w-14 h-14 rounded-lg object-cover border border-neutral-800">
                                <div>
                                    <span class="bg-white text-black font-black text-[9px] px-2 py-0.5 rounded">${p.marketType}</span>
                                    <h4 class="font-bold text-white text-xs mt-1 line-clamp-1">${p.title}</h4>
                                    <div class="text-neutral-300 font-extrabold text-[11px] font-mono mt-0.5">${p.price} ﷼</div>
                                </div>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="editProduct('${key}')" class="p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-300 hover:bg-neutral-800"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteProduct('${key}')" class="p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-red-400 hover:bg-neutral-800"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                allProducts = {};
                totalStatEl.textContent = "0";
                listEl.innerHTML = `<p class="text-center text-neutral-500 py-12 text-xs">لا توجد سيارات مسجلة.</p>`;
            }
        });

        document.getElementById('product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const marketType = document.getElementById('market-type').value;
            const manufacturer = document.getElementById('manufacturer').value;
            const carModelName = document.getElementById('car-model-name').value;
            const category = document.getElementById('car-category').value;
            const year = document.getElementById('car-year').value;
            const price = parseFloat(document.getElementById('price').value);
            const mileage = document.getElementById('mileage').value;
            const description = document.getElementById('description').value;
            
            const fullTitle = `${manufacturer} ${carModelName} ${year} (${category})`;

            let finalImages = uploadedImagesBase64;
            if (finalImages.length === 0 && id && allProducts[id]?.images) {
                finalImages = allProducts[id].images;
            } else if (finalImages.length === 0) {
                finalImages = ['https://placehold.co/600x400'];
            }

            const productData = {
                marketType, title: fullTitle, manufacturer, carModelName, category, year, price, mileage, description,
                image: finalImages[0], images: finalImages
            };

            const loader = document.getElementById('admin-loader');
            loader.classList.remove('hidden');

            const action = id ? update(ref(db, `products/${id}`), productData) : push(productsRef, productData);
            
            action.then(() => {
                loader.classList.add('hidden');
                alert('تم الحفظ بنجاح');
                resetForm();
                adminRouter('manage-cars');
            });
        });

        window.editProduct = function(id) {
            const p = allProducts[id];
            if (!p) return;
            
            adminRouter('add-car');
            document.getElementById('product-id').value = id;
            document.getElementById('market-type').value = p.marketType || '';
            document.getElementById('manufacturer').value = p.manufacturer || '';
            updateCarModelsList();
            document.getElementById('car-model-name').value = p.carModelName || '';
            document.getElementById('car-category').value = p.category || '';
            document.getElementById('car-year').value = p.year || '';
            document.getElementById('price').value = p.price || '';
            document.getElementById('mileage').value = p.mileage || '';
            document.getElementById('description').value = p.description || '';
            
            uploadedImagesBase64 = p.images || [p.image];
            document.getElementById('upload-preview-container').innerHTML = uploadedImagesBase64.map(img => `
                <div class="relative aspect-square rounded-lg overflow-hidden border border-neutral-800 bg-black">
                    <img src="${img}" class="w-full h-full object-cover">
                </div>
            `).join('');

            document.getElementById('form-title').textContent = 'تعديل سيارة';
            document.getElementById('save-btn').textContent = 'تحديث البيانات';
            document.getElementById('cancel-btn').classList.remove('hidden');
        };

        window.deleteProduct = function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                remove(ref(db, `products/${id}`));
            }
        };

        window.resetForm = function() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').textContent = 'إضافة سيارة جديدة';
            document.getElementById('save-btn').textContent = 'حفظ السيارة';
            document.getElementById('cancel-btn').classList.add('hidden');
