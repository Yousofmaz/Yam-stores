<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAM STORES - لوحة الإدارة المتقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl font-black mx-auto mb-3 shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-black text-white">تسجيل دخول الموظفين</h2>
                <p class="text-slate-400 text-sm mt-1">الرقم الوظيفي والرمز السري لإدارة المتجر</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">الرقم الوظيفي</label>
                    <input type="text" id="emp-id" placeholder="مثال: 1001" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">الرمز السري</label>
                    <input type="password" id="emp-pass" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold shadow-lg shadow-indigo-600/30 transition-all">دخول للوحة التحكم</button>
                <p id="login-error" class="text-red-400 text-xs text-center font-bold hidden">الرقم الوظيفي أو الرمز السري غير صحيح!</p>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="hidden max-w-6xl mx-auto p-4 sm:p-8">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-slate-800/60 backdrop-blur-md p-6 rounded-3xl border border-slate-700 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-xl font-black shadow-md">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white">لوحة تحكم YAM STORES</h1>
                    <p class="text-xs text-indigo-400 font-bold" id="logged-user-info">موظف معتمد</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-sm text-slate-200 transition-colors">
                    <i class="fa-solid fa-store ml-1.5"></i> عرض المتجر
                </a>
                <button onclick="logout()" class="px-4 py-2.5 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white font-bold text-sm transition-colors">
                    <i class="fa-solid fa-right-from-bracket ml-1.5"></i> خروج
                </button>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="flex gap-3 mb-8 border-b border-slate-800 pb-4">
            <button onclick="switchTab('add')" id="tab-add" class="px-6 py-3 rounded-2xl font-bold text-sm bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> إضافة منتج جديد
            </button>
            <button onclick="switchTab('manage')" id="tab-manage" class="px-6 py-3 rounded-2xl font-bold text-sm bg-slate-800 text-slate-400 hover:text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> إدارة وتعديل المنتجات
            </button>
        </div>

        <!-- قسم إضافة منتج -->
        <div id="section-add" class="bg-slate-800/50 border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-xl">
            <h2 class="text-xl font-black text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-indigo-500"></i> إضافة منتج جديد برفع صورة مباشرة
            </h2>
            <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">اسم الموقع أو القالب</label>
                    <input type="text" id="p-title" placeholder="مثال: متجر إلكتروني متكامل" required class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">السعر ($)</label>
                    <input type="number" id="p-price" placeholder="199" required class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">شارة مميزة (Badge)</label>
                    <input type="text" id="p-badge" placeholder="الأكثر مبيعاً / خصم" class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">اختر صورة المنتج من الجوال</label>
                    <input type="file" id="p-image-file" accept="image/*" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 file:bg-indigo-600 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-1 file:font-bold text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-400 mb-2">وصف تفصيلي للمنتج (يظهر عند قراءة التفاصيل)</label>
                    <textarea id="p-desc" placeholder="اكتب تفاصيل القالب ومميزاته الكاملة..." rows="4" required class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:border-indigo-500"></textarea>
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" id="add-btn" class="w-full py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-base shadow-xl transition-all">نشر المنتج في المتجر فوراً</button>
                </div>
            </form>
        </div>

        <!-- قسم إدارة المنتجات -->
        <div id="section-manage" class="bg-slate-800/50 border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-xl hidden">
            <h2 class="text-xl font-black text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-500"></i> قائمة المنتجات الحالية (تعديل وحذف)
            </h2>
            <div id="admin-products-list" class="space-y-4">
                <p class="text-slate-400 text-center py-10">جاري جلب المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-black text-white">تعديل بيانات المنتج</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="edit-product-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-old-image">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">اسم المنتج</label>
                    <input type="text" id="edit-title" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">السعر ($)</label>
                    <input type="number" id="edit-price" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">الشارة</label>
                    <input type="text" id="edit-badge" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">تغيير الصورة (اختياري)</label>
                    <input type="file" id="edit-image-file" accept="image/*" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">الوصف التفصيلي</label>
                    <textarea id="edit-desc" rows="3" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white"></textarea>
                </div>
                <button type="submit" id="edit-btn" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg">حفظ التعديلات</button>
            </form>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const authorizedEmployees = {
            "1001": { name: "يوسف (مدير النظام)", pass: "YAM2026" },
            "1002": { name: "موظف مبيعات", pass: "123456" }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmp = localStorage.getItem('yam_emp_id');
            if (savedEmp && authorizedEmployees[savedEmp]) {
                unlockDashboard(authorizedEmployees[savedEmp].name, savedEmp);
            }
        });

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value.trim();
            const pass = document.getElementById('emp-pass').value.trim();
            if (authorizedEmployees[id] && authorizedEmployees[id].pass === pass) {
                localStorage.setItem('yam_emp_id', id);
                unlockDashboard(authorizedEmployees[id].name, id);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        function unlockDashboard(name, id) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            document.getElementById('logged-user-info').textContent = `الموظف: ${name}`;
            loadProductsForManagement();
        }

        window.logout = function() {
            localStorage.removeItem('yam_emp_id');
            location.reload();
        };

        window.switchTab = function(tab) {
            const addSec = document.getElementById('section-add');
            const manageSec = document.getElementById('section-manage');
            const tabAdd = document.getElementById('tab-add');
            const tabManage = document.getElementById('tab-manage');

            if (tab === 'add') {
                addSec.classList.remove('hidden');
                manageSec.classList.add('hidden');
                tabAdd.className = "px-6 py-3 rounded-2xl font-bold text-sm bg-indigo-600 text-white shadow-lg transition-all flex items-center gap-2";
                tabManage.className = "px-6 py-3 rounded-2xl font-bold text-sm bg-slate-800 text-slate-400 hover:text-white transition-all flex items-center gap-2";
            } else {
                addSec.classList.add('hidden');
                manageSec.classList.remove('hidden');
                tabManage.className = "px-6 py-3 rounded-2xl font-bold text-sm bg-indigo-600 text-white shadow-lg transition-all flex items-center gap-2";
                tabAdd.className = "px-6 py-3 rounded-2xl font-bold text-sm bg-slate-800 text-slate-400 hover:text-white transition-all flex items-center gap-2";
            }
        };

        // تحويل الصورة المرفوعة من الجوال إلى Base64
        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // إضافة منتج مع رفع الصورة
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-btn');
            btn.textContent = "جاري رفع الصورة ونشر المنتج...";
            btn.disabled = true;

            const title = document.getElementById('p-title').value;
            const price = Number(document.getElementById('p-price').value);
            const badge = document.getElementById('p-badge').value || 'جديد';
            const description = document.getElementById('p-desc').value;
            const imageFile = document.getElementById('p-image-file').files[0];

            try {
                let image = "";
                if (imageFile) {
                    image = await convertImageToBase64(imageFile);
                }

                await push(ref(db, 'products'), { title, price, badge, image, description });
                alert('تم نشر المنتج بنجاح في المتجر!');
                document.getElementById('add-product-form').reset();
                switchTab('manage');
            } catch (err) {
                alert('حدث خطأ: الفيزا أو حجم الصورة كبير جداً. حاول اختيار صورة أصغر.');
            } finally {
                btn.textContent = "نشر المنتج في المتجر فوراً";
                btn.disabled = false;
            }
        });

        function loadProductsForManagement() {
            const listContainer = document.getElementById('admin-products-list');
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    listContainer.innerHTML = Object.keys(data).map(key => `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-2xl bg-slate-900 border border-slate-700 gap-4">
                            <div class="flex items-center gap-3">
                                <img src="${data[key].image || 'https://placehold.co/100'}" class="w-16 h-16 rounded-xl object-cover border border-slate-700">
                                <div>
                                    <h4 class="font-bold text-white text-base">${data[key].title}</h4>
                                    <div class="text-indigo-400 font-extrabold text-sm mt-0.5">$${data[key].price}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openEditModal('${key}', '${encodeURIComponent(data[key].title)}', ${data[key].price}, '${encodeURIComponent(data[key].badge)}', '${encodeURIComponent(data[key].description)}', '${data[key].image}')" class="px-4 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-white font-bold text-xs transition-colors">
                                    <i class="fa-solid fa-pen ml-1"></i> تعديل
                                </button>
                                <button onclick="deleteProduct('${key}')" class="px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white font-bold text-xs transition-colors">
                                    <i class="fa-solid fa-trash ml-1"></i> حذف
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = `<p class="text-slate-400 text-center py-10">لا توجد منتجات حالياً.</p>`;
                }
            });
        }

        window.deleteProduct = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                remove(ref(db, `products/${id}`));
            }
        };

        window.openEditModal = function(id, title, price, badge, desc, image) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-title').value = decodeURIComponent(title);
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-badge').value = decodeURIComponent(badge);
            document.getElementById('edit-desc').value = decodeURIComponent(desc);
            document.getElementById('edit-old-image').value = image;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeEditModal = function() {
            document.getElementById('edit-modal').classList.add('hidden');
        };

        document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const imageFile = document.getElementById('edit-image-file').files[0];
            let image = document.getElementById('edit-old-image').value;

            if (imageFile) {
                image = await convertImageToBase64(imageFile);
            }

            const updatedData = {
                title: document.getElementById('edit-title').value,
                price: Number(document.getElementById('edit-price').value),
                badge: document.getElementById('edit-badge').value,
                description: document.getElementById('edit-desc').value,
                image: image
            };

            update(ref(db, `products/${id}`), updatedData).then(() => {
                alert('تم تحديث المنتج بنجاح!');
                closeEditModal();
            });
        });
    </script>
</body>
</html>
