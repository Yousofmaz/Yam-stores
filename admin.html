<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAM STORES - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-900">لوحة تحكم YAM STORES</h1>
                <p class="text-sm text-slate-500">أضف، عدل، أو احذف منتجاتك وحدث الأسعار فوراً</p>
            </div>
            <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-sm text-slate-700"><i class="fa-solid fa-store ml-1"></i> عرض المتجر</a>
        </div>

        <!-- Add Product Form -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold text-slate-900 mb-4"><i class="fa-solid fa-plus-circle text-indigo-600 ml-1"></i> إضافة منتج جديد</h2>
            <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" id="p-title" placeholder="اسم الموقع أو القالب" required class="px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="number" id="p-price" placeholder="السعر بالدولار ($)" required class="px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="text" id="p-badge" placeholder="شارة مميزة (مثال: الأكثر مبيعاً)" class="px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="url" id="p-image" placeholder="رابط صورة المنتج (URL)" required class="px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <textarea id="p-desc" placeholder="وصف قصير للموقع..." rows="2" required class="sm:col-span-2 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600"></textarea>
                <button type="submit" class="sm:col-span-2 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-lg shadow-indigo-600/30">حفظ ونشر المنتج فوراً</button>
            </form>
        </div>

        <!-- Products List Management -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4"><i class="fa-solid fa-boxes-stacked text-indigo-600 ml-1"></i> المنتجات الحالية في المتجر</h2>
            <div id="admin-products-list" class="space-y-4">
                <p class="text-slate-400 text-center py-6">جاري جلب المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script for Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Add Product Event
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const price = Number(document.getElementById('p-price').value);
            const badge = document.getElementById('p-badge').value || 'جديد';
            const image = document.getElementById('p-image').value;
            const description = document.getElementById('p-desc').value;

            const productsRef = ref(db, 'products');
            push(productsRef, { title, price, badge, image, description }).then(() => {
                alert('تم إضافة المنتج بنجاح وتم تحديث المتجر!');
                document.getElementById('add-product-form').reset();
            }).catch(err => {
                alert('حدث خطأ أثناء الإضافة: ' + err.message);
            });
        });

        // Display Products for Management
        const productsRef = ref(db, 'products');
        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('admin-products-list');

            if (data) {
                listContainer.innerHTML = Object.keys(data).map(key => `
                    <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-200 gap-4">
                        <img src="${data[key].image}" class="w-14 h-14 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-slate-900 text-sm">${data[key].title}</h4>
                            <span class="text-indigo-600 font-black text-sm">$${data[key].price}</span>
                        </div>
                        <button onclick="deleteProduct('${key}')" class="px-3.5 py-2 rounded-xl bg-red-50 hover:bg-red-500 text-red-500 hover:text-white transition-colors text-sm font-bold"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            } else {
                listContainer.innerHTML = `<p class="text-slate-400 text-center py-6">لا توجد منتجات مسجلة.</p>`;
            }
        });

        window.deleteProduct = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
                const itemRef = ref(db, `products/${id}`);
                remove(itemRef);
            }
        };
    </script>
</body>
</html>
