<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | YAM FOR CARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; background-color: #050505; } 
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .admin-card {
            background: linear-gradient(145deg, #0d0d0d, #080808);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 15px -5px rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-white antialiased h-screen flex flex-col justify-between">

    <div id="admin-loader" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="w-12 h-12 border-4 border-neutral-800 border-t-[#d4af37] rounded-full animate-spin mb-4"></div>
        <p class="gold-text font-bold text-sm tracking-wider">جاري معالجة الطلب...</p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="admin-card rounded-2xl p-6 max-w-sm w-full shadow-2xl border gold-border">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-xl bg-neutral-900 border gold-border text-[#d4af37] flex items-center justify-center font-black text-xl mx-auto mb-3 shadow-lg">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl font-black text-white">تسجيل المشرف</h1>
                <p class="text-neutral-400 text-xs mt-1">YAM FOR CARS</p>
            </div>
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">الرقم الوظيفي (مدير الموقع: 1001)</label>
                    <input type="text" id="emp-id" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">كلمة المرور</label>
                    <input type="password" id="emp-pass" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-[#d4af37] hover:bg-[#c29f30] text-black text-xs font-extrabold rounded-xl shadow-lg transition-all">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-black/95 backdrop-blur-md border-b gold-border shrink-0 h-16">
            <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-neutral-900 border gold-border text-[#d4af37] flex items-center justify-center font-black text-base">
                        <i class="fa-solid fa-gauge"></i>
                    </div>
                    <div>
                        <span class="text-sm font-black text-white block">إدارة YAM FOR CARS</span>
                        <span id="user-role-label" class="text-[9px] gold-text font-bold block"></span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a href="index.html" class="px-3 py-1.5 rounded-xl bg-neutral-900 border gold-border hover:bg-neutral-800 text-xs font-bold text-neutral-300">
                        <i class="fa-solid fa-arrow-right ml-1"></i> الموقع
                    </a>
                    <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-neutral-900 border gold-border hover:bg-red-950 text-xs font-bold text-red-400">
                        خروج
                    </button>
                </div>
            </div>
        </header>

        <div class="bg-neutral-950/50 border-b gold-border py-3 px-4 shrink-0">
            <div id="admin-nav-tabs" class="max-w-4xl mx-auto grid gap-3"></div>
        </div>

        <main class="flex-1 overflow-y-auto max-w-4xl mx-auto w-full px-4 py-6">

            <!-- إضافة سيارة -->
            <div id="admin-sec-add" class="admin-card rounded-2xl p-6 shadow-xl border gold-border">
                <h2 id="form-title" class="text-lg font-black text-white mb-4">إضافة سيارة جديدة</h2>
                <form id="product-form" class="space-y-4">
                    <input type="hidden" id="product-id">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">القسم (السوق)</label>
                            <select id="market-type" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="">اختر القسم...</option>
                                <option value="المستعمل">السوق المستعمل</option>
                                <option value="الجديد">السوق الجديد</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الشركة المصنعة</label>
                            <select id="manufacturer" required onchange="updateCarModelsList()" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="">اختر الشركة...</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">اسم السيارة</label>
                            <select id="car-model-name" required onchange="updateCarCategoriesList()" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="">اختر الشركة أولاً...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الفئة (مثل GLS / فل)</label>
                            <select id="car-category" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="">اختر السيارة أولاً...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">الموديل</label>
                            <select id="car-year" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white font-mono">
                                <option value="">الموديل...</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">طريقة الدفع المتاحة</label>
                            <select id="payment-type" required class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white font-bold">
                                <option value="كاش أو تمويل">كاش أو تمويل (متاح التقسيط)</option>
                                <option value="كاش فقط">كاش فقط (غير متاح تمويل)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-300 mb-1">السعر (بالريال)</label>
                            <input type="number" id="price" required placeholder="مثال: 145000" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white font-mono font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-neutral-900/40 p-3.5 rounded-xl border gold-border">
                        <div>
                            <label class="block text-[11px] font-bold text-neutral-300 mb-1">الممشى</label>
                            <input type="text" id="mileage" placeholder="مثال: 45000 كم" class="w-full bg-neutral-900 border gold-border rounded-lg px-2.5 py-2 text-xs text-white font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-neutral-300 mb-1">حجم المكينة (CC)</label>
                            <input type="text" id="engine-cc" placeholder="مثال: 3500" class="w-full bg-neutral-900 border gold-border rounded-lg px-2.5 py-2 text-xs text-white font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-neutral-300 mb-1">عدد السلندر</label>
                            <select id="cylinders" class="w-full bg-neutral-900 border gold-border rounded-lg px-2.5 py-2 text-xs text-white font-mono">
                                <option value="">اختر...</option>
                                <option value="4">4 سلندر</option>
                                <option value="6">6 سلندر</option>
                                <option value="8">8 سلندر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-neutral-300 mb-1">التيربو</label>
                            <select id="has-turbo" class="w-full bg-neutral-900 border gold-border rounded-lg px-2.5 py-2 text-xs text-white">
                                <option value="لا">لا</option>
                                <option value="نعم">نعم (Turbo)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-1"><i class="fa-solid fa-images ml-1"></i> رفع الصور (حتى 20 صورة)</label>
                        <input type="file" id="image-file-input" multiple accept="image/*" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2 text-xs text-neutral-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#d4af37] file:text-black cursor-pointer">
                        <div id="upload-preview-container" class="grid grid-cols-5 gap-2 mt-3"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-1">ملاحظات وصفية</label>
                        <textarea id="description" rows="3" placeholder="المواصفات الفنية وملاحظات الفحص..." class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2 text-xs text-white"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="save-btn" class="flex-1 py-3 bg-[#d4af37] hover:bg-[#c29f30] text-black text-xs font-extrabold rounded-xl shadow-lg transition-all">حفظ السيارة</button>
                        <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden px-4 py-3 bg-neutral-900 border gold-border text-neutral-300 text-xs font-bold rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- إدارة السيارات -->
            <div id="admin-sec-manage" class="hidden space-y-3">
                <h2 class="text-lg font-black text-white mb-4">قائمة السيارات المسجلة</h2>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>

            <!-- الإحصائيات -->
            <div id="admin-sec-reports" class="hidden admin-card rounded-2xl p-6 border gold-border">
                <h2 class="text-lg font-black text-white mb-4"><i class="fa-solid fa-chart-line gold-text ml-1.5"></i> إحصائيات المعرض وحركة الزوار</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-neutral-900 border gold-border p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1">إجمالي السيارات</span>
                        <span id="stat-total-cars" class="text-3xl font-black gold-text font-mono">0</span>
                    </div>
                    <div class="bg-neutral-900 border gold-border p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1"><i class="fa-solid fa-users text-emerald-400 ml-1"></i> المتواجدون الآن</span>
                        <span id="stat-online-users" class="text-3xl font-black text-emerald-400 font-mono">1</span>
                    </div>
                    <div class="bg-neutral-900 border gold-border p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1"><i class="fa-solid fa-calendar-day gold-text ml-1"></i> زيارات اليوم</span>
                        <span id="stat-daily-visits" class="text-3xl font-black text-white font-mono">0</span>
                    </div>
                    <div class="bg-neutral-900 border gold-border p-4 rounded-xl">
                        <span class="text-neutral-400 text-xs font-bold block mb-1">حالة الاتصال</span>
                        <span class="text-emerald-400 font-extrabold text-xs flex items-center gap-1.5 mt-2"><i class="fa-solid fa-circle-check"></i> متصل بنظام الفايربيز</span>
                    </div>
                </div>
            </div>

            <!-- إدارة الموظفين وكلمات المرور الخاصة بهم -->
            <div id="admin-sec-employees" class="hidden space-y-6">
                <div class="admin-card rounded-2xl p-6 shadow-xl border gold-border">
                    <h2 class="text-lg font-black text-white mb-4"><i class="fa-solid fa-user-plus gold-text ml-2"></i> إضافة موظف جديد وكلمة مروره</h2>
                    <form id="employee-form" class="space-y-4" onsubmit="handleAddEmployee(event)">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-neutral-300 mb-1">اسم الموظف</label>
                                <input type="text" id="emp-name" required placeholder="الاسم الكامل" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-neutral-300 mb-1">الرقم الوظيفي</label>
                                <input type="text" id="emp-code" required placeholder="مثال: 1002" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white font-mono">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-neutral-300 mb-1">كلمة المرور الخاصة به</label>
                                <input type="password" id="emp-password" required placeholder="أدخل كلمة المرور..." class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-neutral-300 mb-1">المسمى الوظيفي</label>
                                <input type="text" id="emp-position" required placeholder="مثال: مسؤول مبيعات" class="w-full bg-neutral-900 border gold-border rounded-xl px-3 py-2.5 text-xs text-white">
                            </div>
                        </div>
                        <button type="submit" class="w-full py-3 bg-[#d4af37] hover:bg-[#c29f30] text-black text-xs font-extrabold rounded-xl shadow-lg transition-all">حفظ الموظف وكلمة المرور</button>
                    </form>
                </div>

                <div class="admin-card rounded-2xl p-6 shadow-xl border gold-border">
                    <h2 class="text-lg font-black text-white mb-4">قائمة موظفي المعرض المسجلين</h2>
                    <div id="admin-employees-list" class="space-y-3"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase & Admin Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productsRef = ref(db, 'products');
        const employeesRef = ref(db, 'employees');

        let allProducts = {};
        let allEmployees = {};
        let uploadedImagesBase64 = [];
        let currentEmpId = localStorage.getItem('emp_id') || '';

        const carBrandsData = {
            "تويوتا (Toyota)": ["كامري", "لاندكروزر", "كورولا", "هايلكس", "راف فور", "أفالون", "برادو", "فورتشنر", "يارس"],
            "مرسيدس-بنز (Mercedes-Benz)": ["الفئة S", "الفئة E", "الفئة C", "G-Class", "GLE", "GLS"],
            "بي إم دبليو (BMW)": ["الفئة السابعة", "الفئة الخامسة", "الفئة الثالثة", "X5", "X6", "X7"],
            "هيونداي (Hyundai)": ["سوناتا", "النترا", "توسان", "سانتافي", "آكسنت", "كريتا", "باليسايد"],
            "كيا (Kia)": ["سيلتوس (Seltos)", "تيلوريد", "سورينتو", "سبورتاج", "K5", "سيراتو", "كيرنز", "سونيت"],
            "لكزس (Lexus)": ["LX 600", "RX", "ES", "LS", "IS", "NX"],
            "فورد (Ford)": ["إكسبلورر", "إكسبيديشن", "مستنج", "تورس", "إيدج"],
            "شيفروليه (Chevrolet)": ["تاهو", "سوبربان", "كامارو", "ترفرس", "بلزر"],
            "بورش (Porsche)": ["كايين", "ماكان", "باناميرا", "911"],
            "رنج روفر / لاند روفر": ["رنج روفر سبورت", "إيفوك", "ديفندر", "فيلار"],
            "نيسان (Nissan)": ["باترول", "التيما", "صني", "إكس تريل", "ماكسيما"],
            "رولز رويس (Rolls-Royce)": ["كوليبان", "فانتوم", "گوست"],
            "جينيسيس (Genesis)": ["G70", "G80", "G90", "GV80", "GV70"],
            "أخرى": ["أخرى"]
        };

        const carCategoriesData = {
            "سيلتوس (Seltos)": ["LX", "EX", "GLS", "Top (فل كامل)"],
            "تيلوريد": ["LX", "EX", "SX", "Full Option"],
            "سبورتاج": ["LX", "EX", "GT-Line"],
            "كامري": ["LE", "GLE", "SE", "Grand Touring"],
            "سوناتا": ["Smart", "Comfort", "Sport", "Limited"],
            "النترا": ["Standard", "Smart", "Premium"],
            "default": ["فل كامل (Full Option)", "نص فل (Mid Option)", "ستاندر / سياحي (Standard)", "GLS", "LX", "EX"]
        };

        window.addEventListener('DOMContentLoaded', () => {
            const manSelect = document.getElementById('manufacturer');
            for (let brand in carBrandsData) {
                let opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                manSelect.appendChild(opt);
            }

            const yearSelect = document.getElementById('car-year');
            for (let y = 2027; y >= 1990; y--) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            }

            onValue(employeesRef, (snapshot) => {
                allEmployees = snapshot.val() || {};
            });

            if (localStorage.getItem('admin_logged') === 'true') {
                setupAdminUI(currentEmpId);
            }
            trackAdminStats();
        });

        function trackAdminStats() {
            const todayStr = new Date().toISOString().split('T')[0];
            const dailyVisitRef = ref(db, `stats/daily_visits/${todayStr}`);
            runTransaction(dailyVisitRef, (current) => (current || 0) + 1);

            const onlineRef = ref(db, `stats/online_admin`);
            const myPresenceRef = push(onlineRef);
            set(myPresenceRef, true);
            setTimeout(() => { remove(myPresenceRef); }, 5000);

            onValue(ref(db, `stats/online_admin`), (snapshot) => {
                const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 1;
                const onlineEl = document.getElementById('stat-online-users');
                if(onlineEl) onlineEl.textContent = count;
            });

            onValue(dailyVisitRef, (snapshot) => {
                const visitsEl = document.getElementById('stat-daily-visits');
                if(visitsEl) visitsEl.textContent = snapshot.val() || 1;
            });
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value.trim();
            const pass = document.getElementById('emp-pass').value.trim();

            if (id === '1001' && pass === '1001') {
                localStorage.setItem('admin_logged', 'true');
                localStorage.setItem('emp_id', id);
                setupAdminUI(id);
                return;
            }

            let foundEmp = null;
            for (let key in allEmployees) {
                if (allEmployees[key].code === id && allEmployees[key].password === pass) {
                    foundEmp = allEmployees[key];
                    break;
                }
            }

            if (foundEmp) {
                localStorage.setItem('admin_logged', 'true');
                localStorage.setItem('emp_id', id);
                setupAdminUI(id);
            } else {
                alert('الرقم الوظيفي أو كلمة المرور غير صحيحة!');
            }
        };

        function setupAdminUI(id) {
            currentEmpId = id;
            const isManager = (id === '1001');
            document.getElementById('user-role-label').textContent = isManager ? 'مدير المعرض (صلاحيات كاملة)' : `موظف برقم: ${id}`;
            
            const navContainer = document.getElementById('admin-nav-tabs');
            if (isManager) {
                navContainer.className = "max-w-4xl mx-auto grid grid-cols-4 gap-2";
                navContainer.innerHTML = `
                    <button onclick="adminRouter('add-car')" id="btn-tab-add" class="py-2 px-1 rounded-xl bg-[#d4af37] text-black font-extrabold text-[11px] shadow-md transition-all flex items-center justify-center gap-1"><i class="fa-solid fa-circle-plus"></i> إضافة</button>
                    <button onclick="adminRouter('manage-cars')" id="btn-tab-manage" class="py-2 px-1 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-[11px] hover:bg-neutral-800 transition-all flex items-center justify-center gap-1"><i class="fa-solid fa-car-rear"></i> السيارات</button>
                    <button onclick="adminRouter('reports')" id="btn-tab-reports" class="py-2 px-1 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-[11px] hover:bg-neutral-800 transition-all flex items-center justify-center gap-1"><i class="fa-solid fa-chart-line"></i> تقارير</button>
                    <button onclick="adminRouter('employees')" id="btn-tab-employees" class="py-2 px-1 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-[11px] hover:bg-neutral-800 transition-all flex items-center justify-center gap-1"><i class="fa-solid fa-users-gear"></i> الموظفين</button>
                `;
            } else {
                navContainer.className = "max-w-4xl mx-auto grid grid-cols-3 gap-3";
                navContainer.innerHTML = `
                    <button onclick="adminRouter('add-car')" id="btn-tab-add" class="py-2.5 px-3 rounded-xl bg-[#d4af37] text-black font-extrabold text-xs shadow-md transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-circle-plus"></i> إضافة سيارة</button>
                    <button onclick="adminRouter('manage-cars')" id="btn-tab-manage" class="py-2.5 px-3 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-car-rear"></i> إدارة السيارات</button>
                    <button onclick="adminRouter('reports')" id="btn-tab-reports" class="py-2.5 px-3 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-chart-line"></i> تقارير المعرض</button>
                `;
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
        }

        window.adminRouter = function(tab) {
            const loader = document.getElementById('admin-loader');
            loader.classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('admin-sec-add').classList.add('hidden');
                document.getElementById('admin-sec-manage').classList.add('hidden');
                document.getElementById('admin-sec-reports').classList.add('hidden');
                const empSec = document.getElementById('admin-sec-employees');
                if(empSec) empSec.classList.add('hidden');

                const btnAdd = document.getElementById('btn-tab-add');
                const btnManage = document.getElementById('btn-tab-manage');
                const btnReports = document.getElementById('btn-tab-reports');
                const btnEmployees = document.getElementById('btn-tab-employees');

                const inactiveClass = "py-2 px-1 sm:py-2.5 sm:px-3 rounded-xl bg-neutral-900 border gold-border text-neutral-300 font-bold text-[11px] sm:text-xs hover:bg-neutral-800 transition-all flex items-center justify-center gap-1";
                const activeClass = "py-2 px-1 sm:py-2.5 sm:px-3 rounded-xl bg-[#d4af37] text-black font-extrabold text-[11px] sm:text-xs shadow-md transition-all flex items-center justify-center gap-1";

                if(btnAdd) btnAdd.className = inactiveClass;
                if(btnManage) btnManage.className = inactiveClass;
                if(btnReports) btnReports.className = inactiveClass;
                if(btnEmployees) btnEmployees.className = inactiveClass;

                if (tab === 'add-car') {
                    document.getElementById('admin-sec-add').classList.remove('hidden');
                    if(btnAdd) btnAdd.className = activeClass;
                } else if (tab === 'manage-cars') {
                    document.getElementById('admin-sec-manage').classList.remove('hidden');
                    if(btnManage) btnManage.className = activeClass;
                } else if (tab === 'reports') {
                    document.getElementById('admin-sec-reports').classList.remove('hidden');
                    if(btnReports) btnReports.className = activeClass;
                } else if (tab === 'employees' && currentEmpId === '1001') {
                    document.getElementById('admin-sec-employees').classList.remove('hidden');
                    if(btnEmployees) btnEmployees.className = activeClass;
                }
                loader.classList.add('hidden');
            }, 200);
        };

        window.updateCarModelsList = function() {
            const man = document.getElementById('manufacturer').value;
            const modelSelect = document.getElementById('car-model-name');
            modelSelect.innerHTML = '<option value="">اختر اسم السيارة...</option>';
            if (man && carBrandsData[man]) {
                carBrandsData[man].forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    modelSelect.appendChild(opt);
                });
            }
            updateCarCategoriesList();
        };

        window.updateCarCategoriesList = function() {
            const model = document.getElementById('car-model-name').value;
            const catSelect = document.getElementById('car-category');
            catSelect.innerHTML = '<option value="">اختر الفئة...</option>';
            
            let matchedCats = carCategoriesData[model] || carCategoriesData["default"];
            matchedCats.forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });
        };

        document.getElementById('image-file-input').addEventListener('change', function(e) {
            const files = Array.from(e.target.files).slice(0, 20);
            uploadedImagesBase64 = [];
            const previewContainer = document.getElementById('upload-preview-container');
            previewContainer.innerHTML = '';
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImagesBase64.push(event.target.result);
                    const div = document.createElement('div');
                    div.className = "relative aspect-square rounded-lg overflow-hidden border gold-border bg-black";
                    div.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover">`;
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        });

        window.logout = function() {
            localStorage.removeItem('admin_logged');
            localStorage.removeItem('emp_id');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
        };

        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById('admin-products-list');
            const totalStatEl = document.getElementById('stat-total-cars');
            if (data) {
                allProducts = data;
                const keys = Object.keys(data);
                totalStatEl.textContent = keys.length;
                listEl.innerHTML = keys.map(key => {
                    const p = data[key];
                    let mainImg = (p.images && p.images[0]) || p.image || 'https://placehold.co/600x400';
                    return `
                        <div class="admin-card rounded-xl p-3.5 flex items-center justify-between gap-3 border gold-border">
                            <div class="flex items-center gap-3">
                                <img src="${mainImg}" class="w-14 h-14 rounded-lg object-cover border gold-border">
                                <div>
                                    <div class="flex gap-1.5 items-center">
                                        <span class="bg-[#d4af37] text-black font-black text-[9px] px-2 py-0.5 rounded">${p.marketType}</span>
                                        <span class="text-[9px] text-neutral-400 font-bold">${p.paymentType || 'كاش أو تمويل'}</span>
                                    </div>
                                    <h4 class="font-bold text-white text-xs mt-1 line-clamp-1">${p.title}</h4>
                                    <div class="gold-text font-extrabold text-[11px] font-mono mt-0.5">${p.price} ﷼</div>
                                </div>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="editProduct('${key}')" class="p-2 rounded-lg bg-neutral-900 border gold-border text-neutral-300 hover:bg-neutral-800"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteProduct('${key}')" class="p-2 rounded-lg bg-neutral-900 border gold-border text-red-400 hover:bg-neutral-800"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                allProducts = {};
                totalStatEl.textContent = "0";
                listEl.innerHTML = `<p class="text-center text-neutral-500 py-12 text-xs">لا توجد سيارات مسجلة.</p>`;
            }
        });

        onValue(employeesRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById('admin-employees-list');
            if (!listEl) return;
            if (data) {
                listEl.innerHTML = Object.keys(data).map(key => {
                    const emp = data[key];
                    return `
                        <div class="bg-neutral-900 border gold-border rounded-xl p-3.5 flex items-center justify-between gap-3">
                            <div>
                                <h4 class="font-bold text-white text-xs">${emp.name}</h4>
                                <div class="text-[11px] text-neutral-400 mt-0.5">الرقم الوظيفي: <span class="font-mono text-white">${emp.code}</span> | كلمة المرور: <span class="font-mono text-amber-300">${emp.password}</span> | الوظيفة: <span class="text-neutral-200 font-bold">${emp.position}</span></div>
                            </div>
                            <button onclick="deleteEmployee('${key}')" class="p-2 rounded-lg bg-neutral-950 border gold-border text-red-400 hover:bg-neutral-800"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                }).join('');
            } else {
                listEl.innerHTML = `<p class="text-center text-neutral-500 py-8 text-xs">لا توجد موظفين مسجلين حالياً.</p>`;
            }
        });

        window.handleAddEmployee = function(e) {
            e.preventDefault();
            const name = document.getElementById('emp-name').value.trim();
            const code = document.getElementById('emp-code').value.trim();
            const password = document.getElementById('emp-password').value.trim();
            const position = document.getElementById('emp-position').value.trim();
            if (!name || !code || !password || !position) return;
            const loader = document.getElementById('admin-loader');
            loader.classList.remove('hidden');
            push(employeesRef, { name, code, password, position }).then(() => {
                loader.classList.add('hidden');
                alert('تم إضافة الموظف وكلمة المرور بنجاح');
                document.getElementById('employee-form').reset();
            });
        };

        window.deleteEmployee = (id) => confirm('هل أنت متأكد من الحذف؟') && remove(ref(db, `employees/${id}`));

        document.getElementById('product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const marketType = document.getElementById('market-type').value;
            const manufacturer = document.getElementById('manufacturer').value;
            const carModelName = document.getElementById('car-model-name').value;
            const category = document.getElementById('car-category').value;
            const year = document.getElementById('car-year').value;
            const price = parseFloat(document.getElementById('price').value);
            const paymentType = document.getElementById('payment-type').value;
            const mileage = document.getElementById('mileage').value;
            const engineCC = document.getElementById('engine-cc').value;
            const cylinders = document.getElementById('cylinders').value;
            const hasTurbo = document.getElementById('has-turbo').value;
            const description = document.getElementById('description').value;
            
            const fullTitle = `${manufacturer} ${carModelName} ${year} (${category})`;

            let finalImages = uploadedImagesBase64;
            if (finalImages.length === 0 && id && allProducts[id]?.images) {
                finalImages = allProducts[id].images;
            } else if (finalImages.length === 0) {
                finalImages = ['https://placehold.co/600x400'];
            }

            const productData = {
                marketType, title: fullTitle, manufacturer, carModelName, category, year, price, paymentType, mileage,
                engineCC, cylinders, hasTurbo, description,
                image: finalImages[0], images: finalImages
            };

            const loader = document.getElementById('admin-loader');
            loader.classList.remove('hidden');

            const action = id ? update(ref(db, `products/${id}`), productData) : push(productsRef, productData);
            action.then(() => {
                loader.classList.add('hidden');
                alert('تم الحفظ بنجاح');
                resetForm();
                adminRouter('manage-cars');
            });
        });

        window.editProduct = function(id) {
            const p = allProducts[id];
            if (!p) return;
            adminRouter('add-car');
            document.getElementById('product-id').value = id;
            document.getElementById('market-type').value = p.marketType || '';
            document.getElementById('manufacturer').value = p.manufacturer || '';
            updateCarModelsList();
            document.getElementById('car-model-name').value = p.carModelName || '';
            updateCarCategoriesList();
            document.getElementById('car-category').value = p.category || '';
            document.getElementById('car-year').value = p.year || '';
            document.getElementById('price').value = p.price || '';
            document.getElementById('payment-type').value = p.paymentType || 'كاش أو تمويل';
            document.getElementById('mileage').value = p.mileage || '';
            document.getElementById('engine-cc').value = p.engineCC || '';
            document.getElementById('cylinders').value = p.cylinders || '';
            document.getElementById('has-turbo').value = p.hasTurbo || 'لا';
            document.getElementById('description').value = p.description || '';
            
            uploadedImagesBase64 = p.images || [p.image];
            document.getElementById('upload-preview-container').innerHTML = uploadedImagesBase64.map(img => `
                <div class="relative aspect-square rounded-lg overflow-hidden border gold-border bg-black">
                    <img src="${img}" class="w-full h-full object-cover">
                </div>
            `).join('');

            document.getElementById('form-title').textContent = 'تعديل سيارة';
            document.getElementById('save-btn').textContent = 'تحديث البيانات';
            document.getElementById('cancel-btn').classList.remove('hidden');
        };

        window.deleteProduct = (id) => confirm('هل أنت متأكد من الحذف؟') && remove(ref(db, `products/${id}`));

        window.resetForm = function() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').textContent = 'إضافة سيارة جديدة';
            document.getElementById('save-btn').textContent = 'حفظ السيارة';
            document.getElementById('cancel-btn').classList.add('hidden');
            document.getElementById('car-model-name').innerHTML = '<option value="">اختر الشركة أولاً...</option>';
            document.getElementById('car-category').innerHTML = '<option value="">اختر السيارة أولاً...</option>';
            document.getElementById('upload-preview-container').innerHTML = '';
            uploadedImagesBase64 = [];
        };
    </script>
</body>
</html>
