<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | YAM FOR CARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #080808);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <header class="bg-black/95 border-b gold-border h-16 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <span class="text-sm font-black tracking-wider block">لوحة تحكم المعرض</span>
        </div>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-neutral-900 border gold-border text-xs font-bold text-neutral-300 hover:text-white transition-all flex items-center gap-1">
            <i class="fa-solid fa-store"></i> استعراض الموقع
        </a>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full p-4 sm:p-6 space-y-6">
        
        <div class="card-box p-6 rounded-3xl border gold-border space-y-4">
            <h2 class="text-sm font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-plus-circle gold-text"></i> إضافة سيارة جديدة للموقع
            </h2>
            
            <form id="car-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">عنوان السيارة (اسمها ومواصفاتها الرئيسية)</label>
                    <input type="text" id="car-title" required placeholder="مثال: جينيسيس G80 فل كامل 2026" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">السعر (ريال سعودي)</label>
                    <input type="number" id="car-price" required placeholder="مثال: 145000" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none font-mono">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">نوع السوق</label>
                    <select id="car-market" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none">
                        <option value="المستعمل">السوق المستعمل</option>
                        <option value="الجديد">السوق الجديد (أصفر وكالة)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">حالة السيارة (تاج الحالة)</label>
                    <input type="text" id="car-tag" value="متوفرة" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">سنة الموديل</label>
                    <input type="number" id="car-year" value="2026" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none font-mono">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">الممشى (كم)</label>
                    <input type="text" id="car-mileage" placeholder="مثال: 10,000" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none font-mono">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">حجم المكينة</label>
                    <input type="text" id="car-engine" placeholder="مثال: 3.5 لتر توربو" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] text-neutral-400 mb-1">طريقة الدفع المتاحة</label>
                    <input type="text" id="car-payment" value="كاش أو تمويل" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[11px] text-neutral-400 mb-1">روابط الصور (ضع كل رابط في سطر مستقل)</label>
                    <textarea id="car-images" rows="3" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg" class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none font-mono"></textarea>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[11px] text-neutral-400 mb-1">ملاحظات إضافية</label>
                    <textarea id="car-desc" rows="2" placeholder="المواصفات الإضافية للسيارة..." class="w-full p-2.5 bg-neutral-900 border gold-border rounded-xl text-xs text-white focus:outline-none"></textarea>
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" id="save-btn" class="w-full py-3 bg-[#d4af37] text-black font-extrabold text-xs rounded-xl shadow-lg hover:bg-[#c29f30] transition-all">
                        نشر السيارة في الموقع مباشرة
                    </button>
                </div>
            </form>
        </div>

        <div class="card-box p-6 rounded-3xl border gold-border space-y-4">
            <h2 class="text-sm font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-car gold-text"></i> إدارة السيارات المنشورة
            </h2>
            <div id="admin-cars-list" class="space-y-3">
                <p class="text-center text-neutral-500 py-6 text-xs">جاري التحميل...</p>
            </div>
        </div>

    </main>

    <footer class="bg-black text-neutral-500 py-3 border-t gold-border text-center text-[11px] font-mono shrink-0">
        YAM FOR CARS Admin © 2026
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('car-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.textContent = 'جاري النشر...';

            const rawImages = document.getElementById('car-images').value.trim();
            const imagesArray = rawImages ? rawImages.split('\n').map(s => s.trim()).filter(Boolean) : ['https://placehold.co/600x400'];

            const newCar = {
                title: document.getElementById('car-title').value,
                price: Number(document.getElementById('car-price').value),
                marketType: document.getElementById('car-market').value,
                statusTag: document.getElementById('car-tag').value,
                year: document.getElementById('car-year').value,
                mileage: document.getElementById('car-mileage').value,
                engineCC: document.getElementById('car-engine').value,
                paymentType: document.getElementById('car-payment').value,
                images: imagesArray,
                description: document.getElementById('car-desc').value,
                approved: true,
                createdAt: Date.now()
            };

            const newRef = push(ref(db, 'products'));
            set(newRef, newCar).then(() => {
                alert('تم نشر السيارة بنجاح!');
                document.getElementById('car-form').reset();
                btn.disabled = false;
                btn.textContent = 'نشر السيارة في الموقع مباشرة';
            }).catch(err => {
                alert('حدث خطأ أثناء النشر: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'نشر السيارة في الموقع مباشرة';
            });
        });

        onValue(ref(db, 'products'), (snapshot) => {
            const data = snapshot.val() || {};
            const listEl = document.getElementById('admin-cars-list');
            const keys = Object.keys(data);

            if (keys.length === 0) {
                listEl.innerHTML = `<p class="text-center text-neutral-500 py-6 text-xs">لا توجد سيارات مسجلة حالياً.</p>`;
                return;
            }

            listEl.innerHTML = keys.map(k => {
                const car = data[k];
                return `
                    <div class="bg-neutral-900/90 border gold-border p-3 rounded-xl flex items-center justify-between gap-3">
                        <div>
                            <h4 class="text-xs font-black text-white">${car.title}</h4>
                            <span class="text-[10px] text-[#d4af37] font-mono">${car.price.toLocaleString()} ﷼ | ${car.marketType}</span>
                        </div>
                        <button onclick="deleteCar('${k}')" class="px-3 py-1.5 bg-red-950/80 border border-red-500/40 text-red-400 text-[11px] font-bold rounded-lg hover:bg-red-900 transition-all">
                            حذف
                        </button>
                    </div>
                `;
            }).join('');
        });

        window.deleteCar = function(carId) {
            if (confirm('هل أنت متأكد من حذف هذه السيارة؟')) {
                remove(ref(db, `products/${carId}`));
            }
        };
    </script>
</body>
</html>
