<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | YAM FOR CARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #080808);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="card-box p-8 rounded-3xl border gold-border w-full max-w-md text-center space-y-6 shadow-2xl">
            <div class="w-16 h-16 bg-[#d4af37]/10 border gold-border rounded-2xl flex items-center justify-center mx-auto text-[#d4af37] text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white">لوحة إدارة المعرض</h1>
                <p class="text-xs text-neutral-400 mt-1">الرجاء إدخال كلمة المرور للمتابعة</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full px-4 py-3 rounded-xl bg-neutral-900 border gold-border text-center text-white focus:outline-none focus:border-[#d4af37] text-sm font-mono">
                <button type="submit" class="w-full py-3 bg-[#d4af37] text-black font-extrabold text-sm rounded-xl hover:bg-[#c29f30] transition-all shadow-lg">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="flex-1 flex flex-col hidden">
        <!-- الشريط العلوي -->
        <header class="bg-black/95 border-b gold-border h-16 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37]">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div>
                    <span class="text-sm font-black tracking-wider block">YAM FOR CARS</span>
                    <span class="text-[9px] gold-text font-semibold tracking-widest block">لوحة التحكم والإدارة</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()" class="px-4 py-2 bg-[#d4af37] text-black text-xs font-extrabold rounded-xl shadow-lg hover:bg-[#c29f30] transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-sm"></i> إضافة سيارة جديدة
                </button>
                <button onclick="logout()" class="px-3 py-2 bg-neutral-900 border gold-border text-neutral-300 hover:text-red-400 text-xs font-bold rounded-xl transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- المحتوى -->
        <main class="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6">
            <div class="flex items-center justify-between pb-2 border-b gold-border">
                <h2 class="text-sm font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-car-side gold-text"></i> سيارات المعرض المسجلة
                </h2>
                <span id="total-cars-count" class="text-xs font-mono text-[#d4af37]">0 سيارة</span>
            </div>

            <!-- قائمة السيارات -->
            <div id="admin-cars-list" class="space-y-3">
                <!-- يتم تعبئتها برمجياً بسرعة عالية -->
            </div>
        </main>
    </div>

    <!-- نافذة إضافة/تعديل سيارة -->
    <div id="car-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="card-box p-6 sm:p-8 rounded-3xl border gold-border w-full max-w-2xl space-y-5 my-8 relative">
            <div class="flex items-center justify-between pb-3 border-b gold-border">
                <h3 id="modal-title" class="text-base font-black text-white">إضافة سيارة جديدة</h3>
                <button onclick="closeModal()" class="text-neutral-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="car-form" onsubmit="saveCar(event)" class="space-y-4">
                <input type="hidden" id="car-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">عنوان السيارة (مثال: جينيسيس G80 فل كامل)</label>
                        <input type="text" id="f-title" required class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">السعر (بالريال السعودي)</label>
                        <input type="number" id="f-price" required class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37] font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">القسم / السوق</label>
                        <select id="f-marketType" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]">
                            <option value="used">السوق المستعمل</option>
                            <option value="new">السوق الجديد (أصفر وكالة)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">سنة الموديل</label>
                        <input type="text" id="f-year" value="2026" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37] font-mono">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">الممشى</label>
                        <input type="text" id="f-mileage" placeholder="0 كم" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37] font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">حجم المكينة</label>
                        <input type="text" id="f-engineCC" placeholder="3.5 لتر / V6" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37] font-mono">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">نظام الدفع</label>
                        <input type="text" id="f-driveType" placeholder="رباعي / خلفي" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">طريقة الدفع</label>
                        <input type="text" id="f-paymentType" value="كاش أو تمويل" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">حالة السيارة (شارة)</label>
                        <input type="text" id="f-statusTag" value="متوفرة" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">روابط الصور (رابط في كل سطر)</label>
                        <textarea id="f-images" rows="2" placeholder="ضع روابط الصور هنا..." class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37] font-mono"></textarea>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-1">ملاحظات ومواصفات إضافية</label>
                    <textarea id="f-description" rows="3" class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-900 border gold-border text-xs text-white focus:outline-none focus:border-[#d4af37]"></textarea>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="f-approved" checked class="w-4 h-4 accent-[#d4af37]">
                    <label for="f-approved" class="text-xs text-white font-bold">نشر السيارة في الموقع مباشرة</label>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t gold-border">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-neutral-900 border gold-border text-neutral-300 rounded-xl text-xs font-bold">إلغاء</button>
                    <button type="submit" class="px-6 py-2 bg-[#d4af37] text-black rounded-xl text-xs font-extrabold shadow-lg hover:bg-[#c29f30] transition-all">حفظ السيارة</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-black text-neutral-500 py-3 border-t gold-border text-center text-[11px] font-mono shrink-0">
        YAM FOR CARS Admin © 2026 - لوحة التحكم السريعة
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, remove, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let cachedCars = {};

        window.handleLogin = function(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === '123456' || pass === 'yam2026' || pass === 'admin') {
                sessionStorage.setItem('yam_auth', 'true');
                checkAuth();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        };

        window.logout = function() {
            sessionStorage.removeItem('yam_auth');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        function checkAuth() {
            if (sessionStorage.getItem('yam_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadCarsFast();
            }
        }

        // تحسين السرعة بجلب البيانات مرة واحدة وتخزينها مؤقتاً
        async function loadCarsFast() {
            const listEl = document.getElementById('admin-cars-list');
            listEl.innerHTML = `<p class="text-center text-neutral-500 py-8 text-xs">جاري تحميل السيارات...</p>`;
            
            try {
                const snap = await get(ref(db, 'products'));
                cachedCars = snap.val() || {};
                renderAdminList();
            } catch(e) {
                listEl.innerHTML = `<p class="text-center text-red-400 py-8 text-xs">خطأ في الاتصال بقاعدة البيانات</p>`;
            }
        }

        function renderAdminList() {
            const listEl = document.getElementById('admin-cars-list');
            const keys = Object.keys(cachedCars);
            document.getElementById('total-cars-count').textContent = `${keys.length} سيارة مسجلة`;

            if (keys.length === 0) {
                listEl.innerHTML = `<p class="text-center text-neutral-500 py-12 text-xs card-box rounded-2xl">لا توجد سيارات مسجلة حالياً.</p>`;
                return;
            }

            listEl.innerHTML = keys.map(k => {
                const car = cachedCars[k];
                const img = car.images?.[0] || 'https://placehold.co/100x100';
                const isPub = car.approved === true;
                return `
                    <div class="card-box rounded-2xl p-3 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border gold-border">
                        <div class="flex items-center gap-3.5 w-full sm:w-auto">
                            <img src="${img}" class="w-16 h-14 rounded-xl object-cover border gold-border shrink-0">
                            <div class="space-y-0.5 text-right">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-mono text-neutral-400">${car.year || '2026'}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded ${isPub ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/30' : 'bg-amber-950 text-amber-400 border border-amber-500/30'}">${isPub ? 'منشورة' : 'مخفية'}</span>
                                </div>
                                <h3 class="text-sm font-black text-white">${car.title}</h3>
                                <div class="text-xs gold-text font-mono font-bold">${Number(car.price || 0).toLocaleString()} ﷼</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end pt-2 sm:pt-0 border-t sm:border-t-0 border-neutral-800">
                            <button onclick="togglePublish('${k}')" class="px-3 py-1.5 rounded-xl bg-neutral-900 border gold-border text-[11px] font-bold text-neutral-300 hover:text-white transition-all">
                                ${isPub ? 'إخفاء' : 'نشر'}
                            </button>
                            <button onclick="editCar('${k}')" class="px-3 py-1.5 rounded-xl bg-neutral-900 border gold-border text-[11px] font-bold text-amber-300 hover:bg-[#d4af37] hover:text-black transition-all">
                                تعديل
                            </button>
                            <button onclick="deleteCar('${k}')" class="px-3 py-1.5 rounded-xl bg-red-950/40 border border-red-500/30 text-[11px] font-bold text-red-400 hover:bg-red-900 hover:text-white transition-all">
                                حذف
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openAddModal = function() {
            document.getElementById('car-form').reset();
            document.getElementById('car-id').value = '';
            document.getElementById('modal-title').textContent = 'إضافة سيارة جديدة';
            document.getElementById('car-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('car-modal').classList.add('hidden');
        };

        window.editCar = function(id) {
            const car = cachedCars[id];
            if (!car) return;
            document.getElementById('car-id').value = id;
            document.getElementById('f-title').value = car.title || '';
            document.getElementById('f-price').value = car.price || '';
            document.getElementById('f-marketType').value = car.marketType || 'used';
            document.getElementById('f-year').value = car.year || '2026';
            document.getElementById('f-mileage').value = car.mileage || '';
            document.getElementById('f-engineCC').value = car.engineCC || '';
            document.getElementById('f-driveType').value = car.driveType || '';
            document.getElementById('f-paymentType').value = car.paymentType || 'كاش أو تمويل';
            document.getElementById('f-statusTag').value = car.statusTag || 'متوفرة';
            document.getElementById('f-images').value = (car.images || []).join('\n');
            document.getElementById('f-description').value = car.description || '';
            document.getElementById('f-approved').checked = car.approved === true;
            document.getElementById('modal-title').textContent = 'تعديل بيانات السيارة';
            document.getElementById('car-modal').classList.remove('hidden');
        };

        window.saveCar = async function(e) {
            e.preventDefault();
            const id = document.getElementById('car-id').value;
            const imagesText = document.getElementById('f-images').value.trim();
            const imagesArr = imagesText ? imagesText.split('\n').map(s => s.trim()).filter(Boolean) : ['https://placehold.co/600x400'];

            const carData = {
                title: document.getElementById('f-title').value.trim(),
                price: Number(document.getElementById('f-price').value),
                marketType: document.getElementById('f-marketType').value,
                year: document.getElementById('f-year').value.trim(),
                mileage: document.getElementById('f-mileage').value.trim(),
                engineCC: document.getElementById('f-engineCC').value.trim(),
                driveType: document.getElementById('f-driveType').value.trim(),
                paymentType: document.getElementById('f-paymentType').value.trim(),
                statusTag: document.getElementById('f-statusTag').value.trim(),
                images: imagesArr,
                description: document.getElementById('f-description').value.trim(),
                approved: document.getElementById('f-approved').checked,
                updatedAt: Date.now()
            };

            try {
                if (id) {
                    await update(ref(db, `products/${id}`), carData);
                    cachedCars[id] = carData;
                } else {
                    const newRef = push(ref(db, 'products'));
                    await set(newRef, carData);
                    cachedCars[newRef.key] = carData;
                }
                closeModal();
                renderAdminList();
            } catch(err) {
                alert('حدث خطأ أثناء الحفظ');
            }
        };

        window.togglePublish = async function(id) {
            const car = cachedCars[id];
            if (!car) return;
            const newStatus = !car.approved;
            try {
                await update(ref(db, `products/${id}`), { approved: newStatus });
                cachedCars[id].approved = newStatus;
                renderAdminList();
            } catch(e) {
                alert('خطأ في التحديث');
            }
        };

        window.deleteCar = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذه السيارة؟')) return;
            try {
                await remove(ref(db, `products/${id}`));
                delete cachedCars[id];
                renderAdminList();
            } catch(e) {
                alert('خطأ في الحذف');
            }
        };

        window.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
